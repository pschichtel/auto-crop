name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: x86_64 Linux (static)
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # musl binaries are statically linked by Rust's default (crt-static).
      - name: Build
        run: cargo build --release --target "$TARGET"
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"

      - name: Verify static linking
        run: |
          bin="target/$TARGET/release/auto-crop"
          file "$bin"
          file "$bin" | grep -q 'static' || { echo "binary is not statically linked"; exit 1; }
          "$bin" --version

      - uses: actions/upload-artifact@v4
        with:
          name: auto-crop-x86_64-linux
          path: target/${{ env.TARGET }}/release/auto-crop
          if-no-files-found: error
